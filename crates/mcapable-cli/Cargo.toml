[package]
name = "mcapable-cli"
version = "0.1.0"
edition = "2021"
authors = ["Jack Valmadre"]
license = "MIT OR Apache-2.0"
description = "Command-line interface for mcapable MCAP library"
repository = "https://github.com/anthropics/mcapable"

[dependencies]
mcapable-core = { path = "../mcapable-core" }
mcapable-opendal = { path = "../mcapable-opendal" }

# CLI dependencies
clap = { version = "4", features = ["derive", "cargo"] }
clap_complete = "4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Table formatting
tabled = "0.20"

# Error handling
anyhow = "1"

# Network/storage
opendal = { version = "0.49", features = ["services-s3", "services-gcs", "services-azblob"] }
ureq = "2"

# Utilities
bytes = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mcapable"
path = "src/main.rs"
