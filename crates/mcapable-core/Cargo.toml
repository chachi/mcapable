[package]
name = "mcapable-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["std", "compression"]
std = [
  "alloc",
  "arcstr/std",
  "bytes/std",
  "crc32fast/std",
  "nom/std",
  "nom_locate/std",
  "dep:polymock",
  "strum/std",
  "thiserror/std",
]
alloc = [
  "nom/alloc",
  "nom_locate/alloc",
]
lz4 = ["std", "dep:lz4_flex"]
zstd = ["std", "dep:zstd"]
compression = ["lz4", "zstd"]
parsers = [
  "std",
  "dep:byteorder",
  "dep:cdr-encoding",
  "dep:serde_json",
  "dep:serde_cbor",
  "dep:rmp-serde",
  "dep:serde",
  "dep:prost-reflect",
  "dep:prost-types",
  "dep:flatbuffers",
  "dep:flatbuffers-reflection",
  "dep:ros2_message",
  "dep:t4_idl_parser",
  "dep:num-traits",
]

[dependencies]
thiserror = { version = "2.0", default-features = false }
nom = { version = "7.1", default-features = false }
nom_locate = { version = "4", default-features = false }
lz4_flex = { version = "0.11", features = ["frame"], optional = true }
zstd = { version = "0.13", optional = true }
crc32fast = { version = "1.5", default-features = false }
strum = { version = "0.26", default-features = false, features = ["derive"] }
arcstr = { version = "1.2", default-features = false, features = ["substr"] }
bytes = { version = "1.11", default-features = false }
polymock = { version = "0.2.2", default-features = false, optional = true, features = ["std"] }
hashbrown = { version = "0.14", default-features = false, features = ["alloc"] }
byteorder = { version = "1.5", optional = true }
cdr-encoding = { version = "0.10.2", optional = true }
serde = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }
serde_cbor = { version = "0.11", optional = true }
rmp-serde = { version = "1.3", optional = true }
prost-reflect = { version = "0.16.3", optional = true, features = ["serde"] }
prost-types = { version = "0.13", optional = true }
flatbuffers = { version = "25.12.19", optional = true }
flatbuffers-reflection = { version = "0.1.0", optional = true }
ros2_message = { version = "0.0.5", optional = true, default-features = true }
t4_idl_parser = { version = "0.1.1", optional = true }
num-traits = { version = "0.2", optional = true }

[dev-dependencies]
proptest = "1.9"
tempfile = "3.23"
serde_json = "1"
