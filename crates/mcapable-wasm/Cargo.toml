[package]
name = "mcapable-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1.11"
js-sys = "0.3"
mcapable-core = { path = "../mcapable-core", default-features = false, features = ["std", "parsers"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
