[package]
name = "mcapable-swift"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "mcapable_swift"
crate-type = ["staticlib"]

[dependencies]
bytes = "1.11"
mcapable-core = { path = "../mcapable-core", features = ["parsers"] }
serde_json = "1.0"
swift-bridge = "0.1"

[build-dependencies]
swift-bridge-build = "0.1"
